# CI-only credentials; this database is ephemeral and never published.
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: panoraiq_test
      POSTGRES_USER: panoraiq
      POSTGRES_PASSWORD: ci-only-password
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U panoraiq -d panoraiq_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    image: panoraiq-tests:${IMAGE_TAG:-local}
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://panoraiq:ci-only-password@db:5432/panoraiq_test
      REQUIRE_POSTGRES: "true"
      COVERAGE_FILE: /tmp/.coverage
    volumes:
      - ./test-results:/results
    depends_on:
      db:
        condition: service_healthy
  app:
    image: panoraiq:${IMAGE_TAG:-local}
    environment:
      DATABASE_URL: postgresql+psycopg://panoraiq:ci-only-password@db:5432/panoraiq_test
      SECRET_KEY: ephemeral-ci-session-key-never-used-outside-tests
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      interval: 2s
      timeout: 5s
      retries: 30
  smoke:
    image: panoraiq-smoke:${IMAGE_TAG:-local}
    command: ["http://app:8000"]
    depends_on:
      app:
        condition: service_healthy
