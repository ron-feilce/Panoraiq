services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - studio-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U studio -d studio"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    image: studio-ledger:local
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql+psycopg://studio:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/studio
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  studio-db:
