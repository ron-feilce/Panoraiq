services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: panoraiq
      POSTGRES_USER: panoraiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - panoraiq-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U panoraiq -d panoraiq"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    image: panoraiq:local
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql+psycopg://panoraiq:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/panoraiq
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  panoraiq-db:
